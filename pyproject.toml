[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "survival-diffusion"
version = "0.1.0"
description = "Multimodal survival prediction with diffusion image encoding and virtual-node fusion"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
survival-diffusion = "survival_diffusion.cli:main"

[tool.setuptools.packages.find]
include = ["survival_diffusion*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9"]
